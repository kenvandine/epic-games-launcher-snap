name: epic-games-launcher
title: Epic Games Launcher
base: core24
version: "0.98.1"
summary: Epic Games Launcher for Linux
description: |
  The Epic Games Launcher lets you browse, buy, install and play games from
  the Epic Games Store.

  This is an unofficial snap that repackages the official Linux AppImage
  published at https://launcher.epicgames.com/. Epic, Epic Games and the
  Epic Games Launcher are trademarks of Epic Games, Inc.

  Games rely on the steam-support interface (Steam runtime and pressure-vessel
  container support), which may need to be connected manually:

    snap connect epic-games-launcher:steam-support
icon: snap/gui/epic-games-launcher.png
grade: devel
confinement: strict
license: Proprietary
platforms:
  amd64:

plugs:
  shmem:
    interface: shared-memory
    private: true

apps:
  epic-games-launcher:
    command: epic-games-launcher/usr/bin/EpicGamesLauncher
    extensions: [gnome]
    desktop: epic-games-launcher/epic-games-launcher.desktop
    common-id: com.epicgames.launcher
    plugs:
      - audio-playback
      - hardware-observe
      - home
      - joystick
      - network
      - network-bind
      - network-status
      - removable-media
      - shmem
      - system-observe
    environment:
      HOME: $SNAP_USER_COMMON
      TMPDIR: $XDG_RUNTIME_DIR
      EGL_DISABLE_SELF_UPDATE: 1

parts:
  launcher:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    stage-packages:
      - xdg-utils
    override-pull: |
      craftctl default
      curl -fL -o EpicGamesLauncher.AppImage \
        "https://content-download-egs.distro.on.epicgames.com/Builds/EGLv2/0.98.1%2Bgd6c4f03/Linux/EpicGamesLauncher-x86_64.AppImage"
      echo "355d4336435dde07388a3b296946edb501f1f1f59e78fc150003eccb30ec68aa  EpicGamesLauncher.AppImage" | sha256sum -c -
    override-build: |
      craftctl default
      chmod +x "$CRAFT_PART_SRC/EpicGamesLauncher.AppImage"
      cd "$CRAFT_PART_BUILD"
      "$CRAFT_PART_SRC/EpicGamesLauncher.AppImage" --appimage-extract >/dev/null
      mv squashfs-root "$CRAFT_PART_INSTALL/epic-games-launcher"
      # AppImage extraction yields 0700 dirs, unreadable by the snap user
      chmod -R u+rwX,go+rX,go-w "$CRAFT_PART_INSTALL/epic-games-launcher"
      # Drop the bundled GTK/WebKit/Mesa stack (the gnome extension provides it).
      # Keep only the EOS SDK, which the binary needs via RUNPATH $ORIGIN/../lib.
      cd "$CRAFT_PART_INSTALL/epic-games-launcher/usr"
      find lib -mindepth 1 -maxdepth 1 \
        ! -name libEOSSDK-Linux-Shipping.so ! -name epic-games-launcher -exec rm -rf {} +
      rm -rf share/glib-2.0 share/icons
      # Point the desktop entry at the snap command and icon
      sed -i -e 's|^Exec=.*|Exec=epic-games-launcher %u|' \
             -e 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' \
        "$CRAFT_PART_INSTALL/epic-games-launcher/epic-games-launcher.desktop"
